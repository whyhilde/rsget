[package]
name = "rsget"
version = "0.1.0"
description = "A fast async CLI file downloader written in Rust"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
futures-util = "0.3.32"
indicatif = "0.18.4"
reqwest = { version = "0.13.3", features = ["stream"] }
tokio = { version = "1.52.1", features = ["full"] }
